<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול צוערים</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-header__top">
        <h1 class="app-title">ניהול צוערים</h1>
        <div class="type-filter" id="type-filter" role="group" aria-label="סינון לפי סוג צוער">
          <button type="button" class="chip" data-type="all">הכול</button>
          <button type="button" class="chip" data-type="personal">אישיים</button>
          <button type="button" class="chip" data-type="officer">קצינותיים</button>
        </div>
      </div>
      <nav class="app-nav" id="app-nav">
        <a href="#/home" data-route="home">בית</a>
        <a href="#/cadets" data-route="cadets">צוערים</a>
        <a href="#/tasks" data-route="tasks">משימות</a>
        <a href="#/meetings" data-route="meetings">פגישות</a>
        <a href="#/goals" data-route="goals">יעדים</a>
        <a href="#/settings" data-route="settings">הגדרות</a>
      </nav>
    </div>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/cadets.js"></script>
  <script src="js/screens/tasks.js"></script>
  <script src="js/screens/meetings.js"></script>
  <script src="js/screens/goals.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
